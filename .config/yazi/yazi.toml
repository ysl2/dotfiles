# Keep this file limited to user overrides so Yazi can supply version-matched defaults.
#:schema https://yazi-rs.github.io/schemas/yazi.json

[opener]
edit = [
	{ run = "${EDITOR:-vi} %s", desc = "$EDITOR", for = "unix", block = true },
	{ run = 'if defined EDITOR (%EDITOR% %s) else (vim %s)', desc = "%EDITOR% or vim", for = "windows", block = true },
]
